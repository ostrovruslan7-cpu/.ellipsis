ellipsis:
  kind: agent
  name: code-review

trigger:
  type: react
  pull_request:
    on: [pushed]
    repositories: [codex, main, ra, railway, s, yt]
    draft: false

session:
  claude_code:
    model: claude-opus-5-5
    prompt: |
      Find bugs in this pull request. Post one review with `gh`
      and comment on the line of each bug. Post nothing if you
      find no bugs or if newer commits arrived.
  environment: all-repositories
  permissions:
    github:
      permissions:
        contents: read
        pull_requests: write
  budget:
    session: 3
